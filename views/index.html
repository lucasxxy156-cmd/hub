<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaHub - ศูนย์รวมมังงะแปลไทย เปรียบเทียบตอนอัปเดตไวที่สุด</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            900: '#3b0764'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .scrollbar-none { scrollbar-width: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.97); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <!-- og:image ต้องเป็น URL เต็ม เช่น https://your-domain.com/images/logo.jpg ถึงจะขึ้นตอนแชร์ลิงก์ -->
    <meta property="og:image" content="/images/logo.jpg">
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col">

    <!-- Header & Nav -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0f172a]/90 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full p-0.5 bg-gradient-to-tr from-purple-500 via-pink-500 to-cyan-400 shadow-lg shadow-purple-500/40">
                    <img src="/images/logo.jpg" alt="MangaHub Logo" class="w-full h-full object-cover rounded-full">
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">MangaHub</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">รวม 6 แหล่งแปลไทย • เทียบตอนใหม่ล่าสุด</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md mx-4">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อมังงะ..."
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-full px-4 py-2 pl-10 text-sm text-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="refreshBtn" class="flex items-center space-x-2 bg-purple-600 hover:bg-purple-700 disabled:opacity-60 disabled:cursor-wait text-white text-xs px-3.5 py-2 rounded-lg font-medium transition shadow-lg shadow-purple-600/20">
                    <i class="fa-solid fa-arrows-rotate text-xs" id="refreshIcon"></i>
                    <span class="hidden sm:inline">รีเฟรช</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Source Badges / Filter -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 w-full">
        <div class="flex items-center justify-between flex-wrap gap-2 pb-2 border-b border-slate-800/60">
            <div class="flex items-center space-x-2 overflow-x-auto py-1 scrollbar-none" id="sourceFilters">
                <button class="filter-btn active text-xs px-3 py-1.5 rounded-full bg-purple-600 text-white font-medium" data-source="all">
                    ทั้งหมด (<span id="totalCount">0</span>)
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-rose-400 hover:text-white font-medium border border-rose-500/30 flex items-center space-x-1" data-source="today">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    </span>
                    <span>⚡ อัปเดตวันนี้ (<span id="todayCount">0</span>)</span>
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="multi">
                    🔥 พบหลายเว็บ
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="MangaBlackCat">
                    <span class="inline-block w-2 h-2 rounded-full bg-orange-500 mr-1"></span>BlackCat
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="SpeedManga">
                    <span class="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-1"></span>Speed
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="UpManga">
                    <span class="inline-block w-2 h-2 rounded-full bg-blue-500 mr-1"></span>UpManga
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="ChibiManga">
                    <span class="inline-block w-2 h-2 rounded-full bg-pink-500 mr-1"></span>Chibi
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="ZenManga">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>Zen
                </button>
                <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white" data-source="BullyManga">
                    <span class="inline-block w-2 h-2 rounded-full bg-purple-500 mr-1"></span>Bully
                </button>
            </div>
            <div class="text-xs text-slate-400" id="lastUpdatedTime">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-1 w-full">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-24 space-y-4">
            <div class="w-12 h-12 border-4 border-purple-500/20 border-t-purple-500 rounded-full animate-spin"></div>
            <p class="text-slate-400 text-sm animate-pulse">กำลังกวาดข้อมูลมังงะจาก 6 เว็บไซต์และรวมเรื่องซ้ำ...</p>
        </div>

        <!-- Manga Grid -->
        <div id="mangaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 hidden">
            <!-- Cards will be injected here via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <i class="fa-solid fa-magnifying-glass text-slate-600 text-4xl mb-3"></i>
            <h3 class="text-base font-semibold text-slate-300" id="emptyTitle">ไม่พบมังงะที่คุณค้นหา</h3>
            <p class="text-xs text-slate-500 mt-1" id="emptyDesc">ลองเปลี่ยนคำค้นหา หรือเลือกฟิลเตอร์ทั้งหมด</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>MangaHub • ระบบรวมฟีดมังงะแปลไทย เปรียบเทียบตอนอัปเดตอัตโนมัติทุก 5 นาที</p>
    </footer>

    <!-- App Logic -->
    <script>
        const AUTO_REFRESH_MS = 5 * 60 * 1000;
        const EMPTY_DEFAULT = { title: 'ไม่พบมังงะที่คุณค้นหา', desc: 'ลองเปลี่ยนคำค้นหา หรือเลือกฟิลเตอร์ทั้งหมด' };

        // รูปสำรองแบบ inline (ไม่พึ่งเว็บภายนอก)
        const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">' +
            '<rect width="300" height="400" fill="#1e293b"/>' +
            '<text x="150" y="205" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">No Cover</text></svg>'
        );

        let allManga = [];
        let currentFilter = 'all';
        let isLoading = false;

        // ป้องกัน XSS / attribute พัง: ข้อมูลทั้งหมดมาจากการ scrape เว็บภายนอก ห้ามเชื่อถือ
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // อนุญาตเฉพาะลิงก์ http(s) (กัน javascript: ฯลฯ)
        function safeUrl(url) {
            return /^https?:\/\//i.test(String(url || '')) ? url : '';
        }

        function safeColor(color) {
            return /^#[0-9a-f]{3,8}$/i.test(String(color || '')) ? color : '#a855f7';
        }

        function setEmptyMessage(title, desc) {
            document.getElementById('emptyTitle').innerText = title;
            document.getElementById('emptyDesc').innerText = desc;
        }

        function setStatus(text, isError = false) {
            const el = document.getElementById('lastUpdatedTime');
            el.innerText = text;
            el.classList.toggle('text-rose-400', isError);
            el.classList.toggle('text-slate-400', !isError);
        }

        // force = true → POST /api/refresh (สั่งดึงเว็บต้นทางใหม่จริงๆ), silent = true → ไม่โชว์ตัวโหลด
        async function fetchMangaData({ force = false, silent = false } = {}) {
            if (isLoading) return;
            isLoading = true;

            const loading = document.getElementById('loading');
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const firstLoad = allManga.length === 0;

            if (!silent) {
                refreshIcon.classList.add('animate-spin');
                refreshBtn.disabled = true;
                if (firstLoad) {
                    loading.classList.remove('hidden');
                    document.getElementById('mangaGrid').classList.add('hidden');
                }
            }

            try {
                const res = await fetch(force ? '/api/refresh' : '/api/manga', { method: force ? 'POST' : 'GET' });
                if (!res.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับ HTTP ' + res.status);
                const json = await res.json();

                allManga = Array.isArray(json.data) ? json.data : [];
                document.getElementById('totalCount').innerText = allManga.length;
                document.getElementById('todayCount').innerText = allManga.filter(m => m.isNewToday).length;

                if (json.updatedAt) {
                    let text = 'อัปเดตล่าสุด: ' + new Date(json.updatedAt).toLocaleTimeString('th-TH');
                    if (force && json.refreshed === false) text += ' (เพิ่งอัปเดตไป ใช้ข้อมูลล่าสุด)';
                    setStatus(text);
                } else {
                    setStatus('ยังไม่มีข้อมูล — เว็บต้นทางอาจยังไม่ตอบสนอง ลองรีเฟรชอีกครั้ง', true);
                }

                setEmptyMessage(EMPTY_DEFAULT.title, EMPTY_DEFAULT.desc);
                renderManga();
            } catch (err) {
                // ถ้ามีข้อมูลเดิมอยู่แล้วให้คงไว้ แล้วแจ้งสถานะแทนการเด้ง alert
                setStatus('โหลดข้อมูลไม่สำเร็จ: ' + err.message, true);
                if (allManga.length === 0) {
                    setEmptyMessage('โหลดข้อมูลไม่สำเร็จ', 'ตรวจสอบว่าเซิร์ฟเวอร์ทำงานอยู่ แล้วกดรีเฟรชอีกครั้ง');
                    renderManga();
                }
            } finally {
                isLoading = false;
                loading.classList.add('hidden');
                refreshIcon.classList.remove('animate-spin');
                refreshBtn.disabled = false;
            }
        }

        function renderManga() {
            const grid = document.getElementById('mangaGrid');
            const empty = document.getElementById('emptyState');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allManga.filter(item => {
                const matchQuery = !query || String(item.title || '').toLowerCase().includes(query);
                if (!matchQuery) return false;

                if (currentFilter === 'all') return true;
                if (currentFilter === 'today') return item.isNewToday;
                if (currentFilter === 'multi') return item.sources.length > 1;
                return item.sources.some(s => s.source === currentFilter);
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');
            grid.classList.remove('hidden');

            grid.innerHTML = filtered.map(item => {
                const hasMultiple = item.sources.length > 1;
                const isNew = item.isNewToday;
                const title = escapeHtml(item.title);
                const cover = escapeHtml(safeUrl(item.cover) || PLACEHOLDER_IMG);

                return `
                <div class="bg-slate-900/90 border ${isNew ? 'border-rose-500/40 shadow-rose-950/20' : 'border-slate-800'} hover:border-purple-500/50 rounded-xl overflow-hidden shadow-lg transition duration-200 flex flex-col group hover:-translate-y-1 relative">

                    <div class="relative aspect-[3/4] bg-slate-950 overflow-hidden">
                        <img src="${cover}"
                             alt="${title}"
                             loading="lazy"
                             referrerpolicy="no-referrer"
                             class="w-full h-full object-cover group-hover:scale-105 transition duration-300">

                        <!-- ป้าย NEW อัปเดตวันนี้ (มุมซ้ายบน) -->
                        ${isNew ? `
                            <span class="absolute top-2 left-2 bg-gradient-to-r from-red-600 to-rose-500 text-white text-[10px] px-2 py-0.5 rounded-md font-extrabold shadow-lg shadow-red-500/50 flex items-center space-x-1 animate-pulse-fast">
                                <i class="fa-solid fa-bolt text-[9px]"></i>
                                <span>NEW</span>
                            </span>
                        ` : ''}

                        <!-- ป้ายแสดงจำนวนเว็บที่พบ (มุมขวาบน) -->
                        ${hasMultiple ? `
                            <span class="absolute top-2 right-2 bg-purple-600/90 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow">
                                ${item.sources.length} เว็บ
                            </span>
                        ` : ''}
                    </div>

                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <h2 class="text-sm font-semibold text-slate-100 line-clamp-2" title="${title}">
                                ${title}
                            </h2>
                        </div>

                        <!-- Source Links with Chapter badges -->
                        <div class="mt-3 space-y-1.5 pt-2 border-t border-slate-800">
                            ${item.sources.map(s => {
                                const chapter = escapeHtml(s.latestChapter);
                                return `
                                <a href="${escapeHtml(safeUrl(s.url) || '#')}" target="_blank" rel="noopener noreferrer"
                                   class="flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs transition group/link">
                                    <span class="font-medium text-[11px] truncate flex items-center" style="color: ${safeColor(s.sourceColor)}">
                                        ${escapeHtml(s.source)}
                                    </span>
                                    <div class="flex items-center space-x-1 min-w-0">
                                        <span class="text-[10px] bg-slate-900 text-slate-300 px-1.5 py-0.5 rounded font-mono border border-slate-700/60 group-hover/link:text-purple-300 truncate max-w-[90px]" title="${chapter}">
                                            ${chapter}
                                        </span>
                                    </div>
                                </a>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // รูปโหลดไม่ขึ้น → ใช้รูปสำรองครั้งเดียว (event error ไม่ bubble จึงต้องฟังแบบ capture)
        document.getElementById('mangaGrid').addEventListener('error', (e) => {
            const img = e.target;
            if (img.tagName === 'IMG' && !img.dataset.fallback) {
                img.dataset.fallback = '1';
                img.src = PLACEHOLDER_IMG;
            }
        }, true);

        // Search event (debounce เล็กน้อยกันเรนเดอร์ถี่ตอนพิมพ์)
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderManga, 150);
        });

        // Refresh button → บังคับดึงข้อมูลใหม่จากเว็บต้นทางจริงๆ
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchMangaData({ force: true });
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white', 'font-medium');
                    if (b.getAttribute('data-source') === 'today') {
                        b.classList.add('bg-slate-800', 'text-rose-400');
                    } else {
                        b.classList.add('bg-slate-800', 'text-slate-400');
                    }
                });
                btn.classList.add('bg-purple-600', 'text-white', 'font-medium');
                btn.classList.remove('bg-slate-800', 'text-slate-400', 'text-rose-400');
                currentFilter = btn.getAttribute('data-source');
                renderManga();
            });
        });

        // Initial Load + โหลดข้อมูลใหม่เงียบๆ ทุก 5 นาที (เฉพาะตอนเปิดหน้านี้อยู่)
        fetchMangaData();
        setInterval(() => {
            if (!document.hidden) fetchMangaData({ silent: true });
        }, AUTO_REFRESH_MS);
    </script>
</body>
</html>
